[project]
name = "komfovent-mcp"
version = "0.1.0"
description = "MCP server for a Komfovent air handling unit over Modbus TCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pymodbus>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
komfovent-mcp = "komfovent_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
